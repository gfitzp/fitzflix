# Formats staged Python files with black and lints them with pyflakes
# before each commit. One-time setup per clone: venv/bin/pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: venv/bin/black
        language: system
        types: [python]
        exclude: ^migrations/
      - id: pyflakes
        name: pyflakes
        entry: scripts/pyflakes-staged
        language: script
        types: [python]
        exclude: ^migrations/
      - id: docstrings
        name: docstrings
        entry: venv/bin/python tests/test_docstrings.py
        language: system
        types: [python]
        exclude: ^migrations/
        pass_filenames: false
