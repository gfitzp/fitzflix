# Formats staged Python files with black, lints them with pyflakes, and
# checks the docstrings and the Simplified Technical English of the prose
# before each commit. One-time setup per clone: venv/bin/pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: venv/bin/black
        language: system
        types: [python]
        exclude: ^migrations/
      - id: pyflakes
        name: pyflakes
        entry: scripts/pyflakes-staged
        language: script
        types: [python]
        exclude: ^migrations/
      - id: docstrings
        name: docstrings
        entry: venv/bin/python tests/test_docstrings.py
        language: system
        types: [python]
        exclude: ^migrations/
        pass_filenames: false
      - id: ste
        name: simplified technical english
        entry: venv/bin/python tests/test_ste.py
        language: system
        files: \.(py|html|js|css|md)$
        exclude: ^migrations/
        pass_filenames: false
